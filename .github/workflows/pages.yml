name: Website
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/media/**', 'assets/icon.png', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Media lives once in docs/media (also used by the README); copy it in at deploy time.
      - name: Assemble site
        run: |
          mkdir -p website/media
          cp docs/media/*.png docs/media/*.gif docs/media/*.mp4 website/media/
          cp assets/icon.png website/media/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
