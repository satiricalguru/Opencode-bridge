<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%}
.stage{height:100%;display:grid;place-items:center;background:radial-gradient(1100px 700px at 10% 0%,#2a5bd7 0,transparent 55%),radial-gradient(900px 700px at 100% 100%,#6d3fd1 0,transparent 55%),#060912}
.stage.light{background:radial-gradient(1100px 700px at 10% 0%,#b9d1ff 0,transparent 55%),radial-gradient(900px 700px at 100% 100%,#e2d2ff 0,transparent 55%),#eef2f8}
.win{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 50px 120px -30px rgba(0,0,0,.65)}
.win img{display:block;width:1240px;height:820px}
.lights{position:absolute;left:20px;top:19px;display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%}
</style></head><body><div class="stage" id="stage"><div class="win"><img id="shot"><div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div></div></div></body></html>
